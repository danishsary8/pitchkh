name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pitchkh
          POSTGRES_PASSWORD: pitchkh
          POSTGRES_DB: pitchkh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pitchkh" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, lint, shared tests and the web build.
      - run: pnpm check
      # API contract tests against a real PostgreSQL.
      - run: pnpm api:test
        env:
          TEST_DATABASE_URL: postgres://pitchkh:pitchkh@localhost:5432/pitchkh_test
      - run: pnpm api:build
