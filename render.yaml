# Render blueprint: API (Docker) + PostgreSQL 16. In Render: New > Blueprint > pick this repo.
# The web app goes on Vercel (see apps/api/README.md, "Deploy").
services:
  - type: web
    name: pitchkh-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitchkh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://pitchkh.vercel.app
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
databases:
  - name: pitchkh-db
    postgresMajorVersion: "16"
