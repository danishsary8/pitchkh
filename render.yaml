# Render blueprint: API (Docker) + PostgreSQL 16. In Render: New > Blueprint > pick this repo.
# The web app goes on Vercel (see apps/api/README.md, "Deploy").
services:
  - type: web
    name: pitchkh-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Uploaded venue photos survive deploys on a disk (Render disks need a paid plan;
    # on the free plan, photos are lost on redeploy).
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitchkh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://pitchkh.vercel.app
      - key: WEB_URL
        sync: false # e.g. https://pitchkh.vercel.app (password reset links)
      - key: PUBLIC_URL
        sync: false # this API's URL, e.g. https://pitchkh-api.onrender.com (photo links)
      - key: RESEND_API_KEY
        sync: false # optional: emails are logged without it
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
databases:
  - name: pitchkh-db
    postgresMajorVersion: "16"
