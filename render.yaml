# Render blueprint: API (Docker) + PostgreSQL 16. In Render: New > Blueprint > pick this repo.
# The web app goes on Vercel (see apps/api/README.md, "Deploy").
services:
  - type: web
    name: pitchkh-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Venue photos go to Cloudflare R2 (STORAGE=r2), so they survive redeploys on the
    # free plan; no Render disk needed.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitchkh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://pitchkh.vercel.app
      - key: WEB_URL
        sync: false # e.g. https://pitchkh.vercel.app (password reset links)
      - key: PUBLIC_URL
        sync: false # this API's URL, e.g. https://pitchkh-api.onrender.com (photo links)
      - key: STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false # e.g. pitchkh-photos
      - key: R2_PUBLIC_URL
        sync: false # e.g. https://pub-xxxx.r2.dev or https://photos.pitchkh.app
      - key: RESEND_API_KEY
        sync: false # optional: emails are logged without it
      - key: PAYMENT_PROVIDER
        value: bakong # "sandbox" for a fake bank while testing
      - key: BAKONG_TOKEN
        sync: false
      - key: BAKONG_ACCOUNT_ID
        sync: false # e.g. yourname@aclb (where the money goes)
      - key: BAKONG_MERCHANT_NAME
        value: PitchKH
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
databases:
  - name: pitchkh-db
    postgresMajorVersion: "16"
